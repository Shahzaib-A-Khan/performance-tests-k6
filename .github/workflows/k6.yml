name: k6 Performance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Smoke test
        uses: grafana/run-k6-action@v1
        with:
          path: smoke-test.js
      - name: API test
        uses: grafana/run-k6-action@v1
        with:
          path: api-test.js